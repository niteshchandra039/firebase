<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://code.jquery.com/jquery-1.10.2.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.14.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>I-Band Interpolator (Sliders)</title>
    <style>
        body { background-color: #f8f9fa; }
        .container { background: rgba(255, 255, 255, 0); padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1); max-width: 95%; }
        h2 { text-align: center; margin-bottom: 20px; }
        .form-control, .form-range { margin-bottom: 10px; }
        #myDiv { min-height: 400px; }
    </style>
</head>
<body>

<div id="nav-placeholder"></div>
<script>$(function() { $("#nav-placeholder").load("nav.html"); });</script>

<div class="container mt-4">
    <h2>Generate I-Band Light Curves of BL Her Stars</h2>
    <p class="text-muted text-center">Move the sliders or input values to see the predicted I-band light curve update immediately.</p>

    <div class="row gx-4">
        <div class="col-md-7">
            <form id="slider-form">
                <div id="sliders"></div>
            </form>
        </div>
        <div class="col-md-5">
            <div id="myDiv" style="width:100%;height:100%;"></div>
        </div>
    </div>
</div>

<div id="footer-placeholder"></div>
<script>$(function() { $("#footer-placeholder").load("footer.html"); });</script>

<script>
    const params = [
        { id: 'm', label: 'Mass (M⊙) [0.5 - 0.8]', min: 0.5, max: 0.8, step: 0.01, value: 0.65, mean: 0.67114, std: 0.09722 },
        { id: 'l', label: 'Luminosity (dex) [1.49 - 2.02]', min: 1.49, max: 2.02, step: 0.01, value: 1.75, mean: 2.12917, std: 0.14453 },
        { id: 't', label: 'Temperature (K) [5200 - 7200]', min: 5200, max: 7200, step: 50, value: 6500, mean: 5979, std: 326 },
        { id: 'X', label: 'X (dex) [0.71 - 0.7549]', min: 0.71, max: 0.7549, step: 0.0001, value: 0.73, mean: 0.73957, std: 0.01240 },
        { id: 'Z', label: 'Z (dex) [0.0001 - 0.02]', min: 0.0001, max: 0.02, step: 0.0001, value: 0.01, mean: 0.00470, std: 0.00488 },
        { id: 'p', label: 'Period (days) [0.1 - 2.0]', min: 0.1, max: 2.0, step: 0.0001, value: 1.0, mean: 2.1414, std: 0.83837 }
    ];

    const slidersDiv = document.getElementById('sliders');
    params.forEach(p => {
        slidersDiv.innerHTML += `
            <label for="${p.id}Range">${p.label}</label>
            <div class="input-group mb-3">
                <input type="range" id="${p.id}Range" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.value}" class="form-range">
                <input type="number" id="${p.id}Input" class="form-control ms-2" value="${p.value}" step="${p.step}" min="${p.min}" max="${p.max}">
            </div>
        `;
    });

    let model;
    tf.loadLayersModel("./models/BLH/web_model_blh_I/model.json").then(m => {
        model = m;
        console.log("Model loaded");
        doPrediction();
    });

    let debounceTimeout;
    function debounce(func, delay = 200) {
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(func, delay);
    }

    function getInputs() {
        return params.map(p => {
            const val = parseFloat(document.getElementById(`${p.id}Range`).value);
            return (val - p.mean) / p.std;
        });
    }

    function doPrediction() {
        if (!model) return;
        const scaledArr = getInputs();
        const inputTensor = tf.tensor(scaledArr, [1, params.length], 'float32');
        const prediction = model.predict(inputTensor).reshape([1000]);

        prediction.array().then(predArr => {
            const phase = Array.from({length: 2000}, (_, i) => i * 2 / 2000);
            const y = [...predArr, ...predArr];
            Plotly.react('myDiv', [{ x: phase, y, type: 'scatter' }], {
                margin: { t: 30, r: 10, l: 50, b: 50 },
                title: 'I-Band Light Curve',
                xaxis: { title: 'Phase', showgrid: false, zeroline: false },
                yaxis: { title: 'Magnitude', autorange: 'reversed' }
            });
        });
    }

    params.forEach(p => {
        const slider = document.getElementById(`${p.id}Range`);
        const number = document.getElementById(`${p.id}Input`);

        slider.addEventListener('input', () => {
            number.value = slider.value;
            debounce(doPrediction);
        });

        number.addEventListener('input', () => {
            slider.value = number.value;
            debounce(doPrediction);
        });
    });
</script>

</body>

    <!-- Footer -->
    <div id="footer-placeholder"></div>
    <script>$(function () { $("#footer-placeholder").load("footer.html"); });</script>

    <!-- FontAwesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

</html>
